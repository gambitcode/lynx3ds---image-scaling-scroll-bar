name: Build 3DS app

on:
  workflow_dispatch:
  push:
    branches:
      - ci/github-actions-build
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl ca-certificates unzip xz-utils

      - name: Install devkitARM
        run: |
          mkdir -p /tmp/devkitpro
          cd /tmp/devkitpro

          wget -q "https://github.com/devkitPro/installer/releases/download/v1.0.0/devkitpro-pacman.deb"
          sudo dpkg -i devkitpro-pacman.deb

          sudo dkp-pacman -Sy
          sudo dkp-pacman -S --noconfirm devkitARM
          sudo dkp-pacman -S --noconfirm 3ds-dev 3ds-libcurl 3ds-libjpeg-turbo 3ds-libpng 3ds-zlib

      - name: Set environment variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make clean || true
          make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynx3ds-build
          path: |
            lynx3ds.3dsx
            lynx3ds.elf
            lynx3ds.smdh
